name: My First Workflow

on:
  push:

jobs:
  first-job:
    runs-on: ubuntu-latest

    steps:
      - name: Print greeting
        run: echo "Hello, GitHub Actions!"

      - name: Print date
        run: echo "Today is $(date)"

      - name: Print working directory
        run: echo "Current directory is $(pwd)"

  deploy:
    name: Deploy Job
    runs-on: ubuntu-latest

    steps:
      - name: Deploy
        run: echo "Deploying..."
